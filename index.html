    function PipelineView(){

      var bfs=useState("idle"),backfillStatus=bfs[0],setBackfillStatus=bfs[1];

      var bfc=useState(0),backfillCount=bfc[0],setBackfillCount=bfc[1];
      var bft=useState(0),backfillTotal=bft[0],setBackfillTotal=bft[1];
      var pcs=useState(null),propCounts=pcs[0],setPropCounts=pcs[1];

      useEffect(function(){
        supabase.from("pipeline_log").select("*").gte("ran_at",new Date(Date.now()-24*60*60*1000).toISOString()).order("ran_at",{ascending:false}).limit(200).then(function(r){
          setLogs(r.data||[]);setLoading(false);
        });
        // Live counts directly from properties table
        var day1=new Date(Date.now()-24*60*60*1000).toISOString();
        var day7=new Date(Date.now()-7*24*60*60*1000).toISOString();
        var day30=new Date(Date.now()-30*24*60*60*1000).toISOString();
        Promise.all([
          supabase.from("properties").select("id,created_at,priority,address").order("created_at",{ascending:false})
        ]).then(function(r){
          var all=r[0].data||[];
          setPropCounts({
            total:all.filter(function(p){return !p.is_discarded&&!p.is_sold;}).length,
            last24h:all.filter(function(p){return new Date(p.created_at)>new Date(day1);}).length,
            last7d:all.filter(function(p){return new Date(p.created_at)>new Date(day7);}).length,
            last30d:all.filter(function(p){return new Date(p.created_at)>new Date(day30);}).length,
            recent:all.slice(0,20)
          });
        });
      },[]);

      function runBackfill(){
        setBackfillStatus("running");setBackfillProgress("Loading properties...");setBackfillCount(0);
        // Load all active properties that have comps but no traffic lights
        supabase.from("properties").select("*").eq("is_discarded",false).eq("is_sold",false).then(function(r){
          // Score ALL properties that have any comparable data, not just those missing traffic lights
          var props=(r.data||[]).filter(function(p){
            return p.comp_1_address||p.comp_2_address||p.comp_3_address||
              p.rental_link_1_label||p.rental_link_2_label||p.rental_link_3_label;
          });
          setBackfillTotal(props.length);
          if(props.length===0){setBackfillStatus("done");setBackfillProgress("No properties need backfilling — all traffic lights are set.");return;}
          setBackfillProgress("Found "+props.length+" properties to backfill. Processing...");

          // Process sequentially with a small delay to avoid rate limits
          function processNext(i){
            if(i>=props.length){
              setBackfillStatus("done");
              setBackfillProgress("Done — backfilled "+props.length+" properties.");
              return;
            }
            var prop=props[i];
            setBackfillProgress("Processing "+(i+1)+" of "+props.length+": "+prop.address);

            // Ask the Edge Function to re-score comparables only
            var prompt="You are assessing comparables for a UK property already in our database. For each comparable below, assign a traffic light using the exact matrix from our Deal Flow Criteria document:\n"
              +"- green: same property type (e.g. semi-detached to semi-detached) AND within 1 mile\n"
              +"- amber: same property type AND within 3 miles\n"
              +"- red: similar but not exact type match, within 3 miles\n"
              +"- null: no comparable data available for this slot\n\n"
              +"Subject property: "+prop.address+" | Type: "+(prop.type||"unknown")+"\n\n"
              +"Comparable sales:\n"
              +"1. "+(prop.comp_1_address||"none")+" - "+(prop.comp_1_price||"")+"\n"
              +"2. "+(prop.comp_2_address||"none")+" - "+(prop.comp_2_price||"")+"\n"
              +"3. "+(prop.comp_3_address||"none")+" - "+(prop.comp_3_price||"")+"\n\n"
              +"Rental comparables:\n"
              +"1. "+(prop.rental_link_1_label||"none")+"\n"
              +"2. "+(prop.rental_link_2_label||"none")+"\n"
              +"3. "+(prop.rental_link_3_label||"none")+"\n\n"
              +"Return ONLY a JSON object with these exact keys: comp_1_traffic_light, comp_2_traffic_light, comp_3_traffic_light, rental_link_1_traffic_light, rental_link_2_traffic_light, rental_link_3_traffic_light. Values must be \"green\", \"amber\", \"red\", or null only.";

            fetch(SUPA_URL+"/functions/v1/ask-property",{
              method:"POST",
              headers:{"Content-Type":"application/json","Authorization":"Bearer "+SUPA_KEY},
              body:JSON.stringify({prompt:prompt})
            }).then(function(res){return res.json();}).then(function(d){
              var text=d.result||"";
              var clean=text.replace(/```json\s*/gi,"").replace(/```\s*/g,"").trim();
              var start=clean.indexOf("{"),end=clean.lastIndexOf("}");
              if(start!==-1&&end!==-1){
                try{
                  var tl=JSON.parse(clean.slice(start,end+1));
                  var update={updated_at:new Date().toISOString()};
                  ["comp_1_traffic_light","comp_2_traffic_light","comp_3_traffic_light",
                   "rental_link_1_traffic_light","rental_link_2_traffic_light","rental_link_3_traffic_light"].forEach(function(k){
                    if(tl[k]!==undefined)update[k]=tl[k];
                  });
                  supabase.from("properties").update(update).eq("id",prop.id).then(function(){
                    setBackfillCount(i+1);
                    setTimeout(function(){processNext(i+1);},600); // small delay between calls
                  });
                }catch(e){
                  setTimeout(function(){processNext(i+1);},600);
                }
              } else {
                setTimeout(function(){processNext(i+1);},600);
              }
            }).catch(function(){
              setTimeout(function(){processNext(i+1);},600);
            });
          }
          processNext(0);
        });
      }

      var sources=["Rightmove","Zoopla","propertyauctions.io","Savills Auctions","Allsop","Barnard Marcus","Strettons","SDL Auctions","Network Auctions","iamsold","Clive Emson"];
      var totalAdded=logs.reduce(function(s,l){return s+(l.properties_added||0);},0);

          h("div",{style:{fontFamily:"'IBM Plex Mono',monospace",fontSize:"0.82rem",color:"#fff",letterSpacing:"0.06em",fontWeight:700,flexShrink:0}},"PROPERTY DEAL FLOW"),
          h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
            h("button",{className:"nav-btn"+(view==="properties"?" on":""),onClick:function(){setView("properties");}},"Properties"),
            h("button",{className:"nav-btn"+(view==="pipeline"?" on":""),onClick:function(){setView("pipeline");}},"Pipeline Status"),
            h("button",{className:"nav-btn"+(view==="auctions"?" on":""),onClick:function(){setView("auctions");}},"Auctions"),
            h("button",{className:"nav-btn",onClick:function(){setShowAdd(true);},style:{background:"#fff",color:"#4a0e22",border:"none",fontWeight:700}},"+  Add")
          ),
          h("div",{style:{display:"flex",alignItems:"center",gap:8}},
            syncMsg?h("span",{style:{fontSize:"0.68rem",color:"#f9c6d0",fontFamily:"'IBM Plex Mono',monospace"}},syncMsg):null,
            h("div",{style:{fontSize:"0.65rem",color:"rgba(255,255,255,0.55)"}},"HA8 6TQ \u00b7 "+actv+"/"+MAX_ACTIVE+(incomplete>0?" \u00b7 \u26a0 "+incomplete:""))
          )
        ),
        view==="properties"&&h("div",{style:{background:"#fff",borderBottom:"1px solid #e2e2e8",padding:"8px 28px",display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}},
          FILTERS.map(function(f){var cls="filter-btn";if(filter===f){  if(f==="HIGH")cls+=" on-high";  else if(f==="MEDIUM")cls+=" on-medium";  else if(f==="LOW")cls+=" on-low";  else cls+=" on";}return h("button",{key:f,className:cls,onClick:function(){setFilter(f);}},fl(f));}),
          h("div",{style:{marginLeft:"auto",display:"flex",gap:8,alignItems:"center"}},
            h("select",{value:dateFilter,onChange:function(e){setDateFilter(Number(e.target.value));},
              style:{fontSize:"0.68rem",fontFamily:"'Inter',sans-serif",border:"1px solid #ddd",
              borderRadius:20,padding:"4px 10px",color:"#666",background:"#fff",cursor:"pointer"}},
              h("option",{value:0},"All dates"),
              h("option",{value:1},"Today"),
              h("option",{value:2},"Last 2 days"),
              h("option",{value:5},"Last 5 days"),
              h("option",{value:7},"Last 7 days"),
              h("option",{value:10},"Last 10 days"),
              h("option",{value:20},"Last 20 days")
            ),
            h("button",{onClick:loadData,style:{padding:"5px 12px",borderRadius:20,
              border:"1px solid #ddd",background:"#fff",fontSize:"0.68rem",
              fontFamily:"'Inter',sans-serif",cursor:"pointer",color:"#888"}},"\u21bb")
          )
        ),
        view==="properties"&&h("div",{className:"cards-grid"},
          filtered.map(function(prop){return h(PropertyCard,{key:prop.id,prop:prop,comments:comments[prop.id]||[],expanded:expanded===prop.id,lastVisit:lastVisit,userName:userName,setUserName:setUserName,onExpand:function(){setExpanded(expanded===prop.id?null:prop.id);},onFav:function(){toggleFav(prop);},onDiscard:function(){toggleDiscard(prop);},onSold:function(price){markAsSold(prop,price);},onComment:function(text,clear,isQ,p,done,u){submitComment(prop.id,text,clear,isQ,p,done,u);},onUpdate:function(updated,commentText,cmd){updateProperty(updated,commentText,cmd);},onDeleteComment:function(commentId){setComments(function(prev){var n=Object.assign({},prev);n[prop.id]=(n[prop.id]||[]).filter(function(x){return x.id!==commentId;});return n;});},setComments:setComments});}),
          filtered.length===0&&h("div",{style:{gridColumn:"1/-1",textAlign:"center",padding:"80px 20px",color:"#ccc",fontFamily:"'IBM Plex Mono',monospace",fontSize:"0.85rem"}},"No properties match this filter")
        ),
        view==="pipeline"&&h(PipelineView,null),
        view==="auctions"&&h(AuctionView,null)
      );
    }

    createRoot(document.getElementById("root")).render(h(App,null));
  </script>
</body>
</html>
